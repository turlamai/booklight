<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booklight — 设置（移动端）</title>
<link rel="stylesheet" href="shared.css">
</head>
<body class="mobile" data-screen="settings">
<div id="app" class="m-app"><noscript>请启用 JavaScript 以体验此交互原型。</noscript></div>
<dialog class="m-dialog" id="dialog" aria-label="操作详情"></dialog>
<div class="m-sr" id="live" aria-live="polite"></div>
<div class="m-notice-wrap"><p class="m-feedback" id="notice" role="status" hidden></p></div>
<script>
(() => {
'use strict';
const screen = document.body.dataset.screen;
const $ = (q, root=document) => root.querySelector(q);
const $$ = (q, root=document) => [...root.querySelectorAll(q)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = 'booklight-mobile-v1';
const routes = {library:'mobile-library.html',reading:'mobile-reading.html',pdf:'mobile-pdf.html',ai:'mobile-ai.html',settings:'mobile-settings.html'};
const themeNames = {light:'纸张',sepia:'深纸',dark:'夜间'};
const icons = {
 back:'m14 5-7 7 7 7M7 12h13',next:'m9 5 7 7-7 7',close:'m6 6 12 12M6 18 18 6',
 settings:'M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6M10 15v6',
 book:'M4 3h6a3 3 0 0 1 3 3v15a4 4 0 0 0-4-2H4V3Zm9 3a3 3 0 0 1 3-3h4v16h-4a4 4 0 0 0-3 2',
 bookmark:'M6 3h12v18l-6-4-6 4V3Z',more:'M5 12h.1m6.9 0h.1m6.9 0h.1',
 arrow:'M5 12h14m-6-6 6 6-6 6',copy:'M8 8h12v13H8zM16 8V3H3v13h5',
 spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z',
 rotate:'M20 7V3l-4 4M20 7a8 8 0 1 0 0 10',check:'m5 12 4 4L19 6',
 download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4'
};
const icon = name => `<svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name]||icons.book}"/></svg>`;
const button = (text,action,cls='',attr='',ico='') => `<button type="button" class="${cls}" data-action="${action}" ${attr}>${ico?icon(ico):''}${text}</button>`;
const ib = (label,action,name,attr='') => button('',action,'quiet m-iconbutton',`aria-label="${label}" title="${label}" ${attr}`,name);
const link = (text,to,cls='',ico='',attrs='') => `<a class="m-button ${cls}" href="${routes[to]}" data-nav="${to}" ${attrs}>${ico?icon(ico):''}${text}</a>`;
const defaultState = () => ({appTheme:'light',readTheme:'light',font:17,chapter:2,scroll:{},books:['epub','pdf'],recent:'epub',selection:null,marks:[],bookmark:false,settingsFrom:'library',aiSource:'reading',pdf:{page:3,rotation:90,pending:true},config:{provider:'智谱 GLM',url:'',model:'glm-4.7'},ai:{tab:'summary',scope:'当前页',draft:'',summary:null,chat:[],status:'idle'},saved:'idle',jump:null});
let stored={},storage=true;
try { stored=JSON.parse(localStorage.getItem(key)||'{}'); }
catch { storage=false;try { if(window.name.startsWith(key+':'))stored=JSON.parse(window.name.slice(key.length+1)); }catch {} }
const M = Object.assign(defaultState(),stored);
M.pdf=Object.assign(defaultState().pdf,stored.pdf||{});M.pdf.rotations=M.pdf.rotations||{'3':90};M.ai=Object.assign(defaultState().ai,stored.ai||{});M.config=Object.assign(defaultState().config,stored.config||{});
M.books=Array.isArray(M.books)?M.books.filter(x=>['epub','pdf'].includes(x)):['epub','pdf'];
M.marks=Array.isArray(M.marks)?M.marks:[];M.chapter=Math.min(5,Math.max(1,Number(M.chapter)||2));
if(!themeNames[M.readTheme])M.readTheme='light';if(!['light','dark'].includes(M.appTheme))M.appTheme='light';
M.font=Math.min(26,Math.max(16,Number(M.font)||17));
if(M.ai.status==='loading'){M.ai.status='stopped';M.ai.error='上次演示已中断，草稿已保留。'}
let immersive=false,dialogTrigger=null,job=null,pendingPreview=null,epoch=0;
const sampleParas=[
'每个文明的起点并非一张白纸。可驯化的动植物在不同大陆的分布极不均匀，这份初始清单在数千年前就写定了后来的剧本。',
'粮食生产带来了定居、存储与人口密度，也带来了与驯化动物共处而来的病菌——后者在后来的碰撞中，比刀剑更加致命。',
'贸易把不同族群的禀赋连成网络，城市因此生长；而技术的传播速度，取决于社会的接纳成本。',
'把这些变量放回同一个模型，就能解释为什么枪炮与钢铁出现在欧亚大陆的东端与西端，而不是其他地方。'
];
const chapterTitles=['阅读的起点','起点的不平等','传播的方向','技术与社会','回看与笔记'];
function paragraphs(chapter=M.chapter){return chapter===2?sampleParas:[
'阅读并不止于记住一个结论。把问题、证据与作者的解释放回同一个视野，才能看见论证如何成立。',
'留下一句摘录时，也要留下它的来处。再次回到原文，往往能发现先前没有注意到的条件。',
'这是一段用于展示章节切换与排版的示例文本。字号、版心与行距沿用阅读契约，不代表真实出版物内容。'
];}
const pdfText='共路干涉布局使参考光与测量光沿相近路径传播。记录光路、采样方式与环境条件，有助于核对测量差异。';
function save(){try{localStorage.setItem(key,JSON.stringify(M));storage=true;return true}catch{storage=false;try{window.name=key+':'+JSON.stringify(M)}catch{}return false}}
function announce(t){$('#live').textContent=t;const n=$('#notice');if(n){n.textContent=t;n.hidden=false;}}
function capture(){if($('#readScroll'))M.scroll[screen]=$('#readScroll').scrollTop;if($('#question'))M.ai.draft=$('#question').value;save()}
function go(to){if(!routes[to])return;capture();location.href=new URL(routes[to],location.href).href}
function topbar(title,back='library',right='settings'){return `<header class="m-header"><nav class="m-nav" aria-label="页面导航">${screen==='library'?'<a class="m-button quiet" href="../index.html">'+icon('back')+'返回</a>':link('返回',back,'quiet','back')}<span class="m-fill"></span>${right?ib(right==='settings'?'设置':'返回阅读',right==='settings'?'settings':'ai-back',right==='settings'?'settings':'close'):''}</nav><h1>${title}</h1></header>`}
function themeButtons(){return `<div class="m-themebar" role="group" aria-label="阅读主题">${Object.entries(themeNames).map(([v,l])=>button(l,'theme','',`data-theme="${v}" aria-pressed="${M.readTheme===v}"`)).join('')}</div>`}
function cover(type,large=false){return `<span class="m-cover ${large?'large':''}" aria-label="${type.toUpperCase()} 文档示意"><span>${type.toUpperCase()}</span>${icon('book')}<span>文档示意</span></span>`}
function bookName(id){return id==='epub'?'The Sample Book':'激光干涉仪设计手册'}
function position(id){return id==='epub'?`第 ${M.chapter} / 5 章`:`第 ${M.pdf.page} / 12 页`}
function bookLink(id){return id==='epub'?'reading':'pdf'}
function library(){const recent=M.books.includes(M.recent)?M.recent:M.books[0];return `${topbar('书库','library')}<main class="m-content">${!M.books.length?`<section class="m-empty"><h2>还没有最近阅读的文档</h2><p>在 iPhone 中从文件导入 PDF 或 EPUB。<br>桌面文档的传输与同步方式待实现立项确定。</p>${button('查看导入说明','import','emphasis')}<div style="margin-top:16px">${button('载入示例文档','restore','quiet')}</div></section>`:`<section class="m-recent" aria-labelledby="continueTitle"><div class="m-row">${cover(recent,true)}<div class="m-fill m-stack"><span class="m-small m-muted">最近在读</span><h2 id="continueTitle">${bookName(recent)}</h2><span class="m-small m-muted">${position(recent)} · ${themeNames[M.readTheme]}</span><progress class="m-progress" value="${recent==='epub'?M.chapter:M.pdf.page}" max="${recent==='epub'?5:12}" aria-label="阅读进度"></progress></div></div><a class="m-button emphasis" href="${routes[bookLink(recent)]}" data-book="${recent}">${icon('book')}继续阅读</a></section><section class="m-section"><div class="m-row"><h2 class="m-fill">全部书目</h2><span class="m-small m-muted">${M.books.length} 份文档</span></div>${M.books.map(id=>`<a class="m-book" href="${routes[bookLink(id)]}" data-book="${id}">${cover(id)}<span class="m-fill m-stack"><span class="m-book-title">${bookName(id)}</span><span class="m-small m-muted">${id.toUpperCase()} · ${position(id)}</span></span>${icon('next')}</a>`).join('')}<p class="m-small m-muted" style="margin-top:16px">示例文档用于原型演示，不连接桌面书库。</p></section><div class="m-row m-wrap">${button('导入文档…','import','quiet')}${button('管理书目','manage','quiet')}</div>`}<p class="m-small m-muted" style="margin-top:24px">文档内容仅在你主动使用 AI 并核对后发送。本原型不发起请求。</p><a class="m-button quiet" href="../index.html">返回原型导航</a></main>`}
function markedText(text,index){const entries=M.marks.filter(x=>x.chapter===M.chapter&&x.para===index&&text.includes(x.text));let ranges=[];for(const n of entries){const start=text.indexOf(n.text);if(!ranges.some(r=>start<r.end&&start+n.text.length>r.start))ranges.push({...n,start,end:start+n.text.length})}ranges.sort((a,b)=>a.start-b.start);let out='',at=0;for(const r of ranges){out+=esc(text.slice(at,r.start));const cl=r.type==='underline'?'m-underline':r.type==='strike'?'m-strike':r.color||'';out+=(r.type==='highlight'?`<mark class="${cl}">`:`<span class="${cl}">`)+esc(text.slice(r.start,r.end))+(r.type==='highlight'?'</mark>':'</span>');at=r.end}return out+esc(text.slice(at))}
function selectionBar(){return `<div class="m-selection-title"><span>已选 ${[...(M.selection?.text||'')].length} 字符</span>${ib('关闭划词工具','selection-close','close')}</div>${button('高亮','mark','','data-color="yellow"')}${button('蓝色','mark','','data-color="blue"')}${button('绿色','mark','','data-color="green"')}${button('下划线','underline')}${button('删除线','strike')}${button('摘句','excerpt')}${button('复制','copy')}${button('AI 助手','ai-selection')}`}
function reader(){return `<main class="m-reader ${immersive?'m-immersion':''}" data-read-theme="${M.readTheme}" style="--read-size:${M.font}px"><header class="m-header" data-chrome><div class="m-nav">${link('书库','library','quiet','back')}<span class="m-subtitle">第 ${M.chapter} 章</span>${ib('目录','chapters','book')}${ib('阅读设置','settings','settings')}</div></header><section class="m-scroll" id="readScroll" aria-label="阅读正文，轻点中央或按 Enter 显示或隐藏工具" tabindex="0"><article class="m-prose" id="prose"><span class="m-chapter">The Sample Book · EPUB</span><h1>${chapterTitles[M.chapter-1]}</h1>${paragraphs().map((t,i)=>`<p id="passage-${i}" data-para="${i}">${markedText(t,i)}</p>`).join('')}${M.chapter===2?'<blockquote>「大陆轴线的走向，决定了作物与技术的传播是同纬度的顺流，还是跨气候带的逆流。」</blockquote>':''}<p class="m-chapter">轻点正文中央，呼出或隐藏阅读工具。</p></article></section><aside id="selectionBar" class="m-selection" aria-label="SelectionBar 划词工具" ${M.selection?'':'hidden'}>${M.selection?selectionBar():''}</aside><div class="m-save ${M.saved==='failed'?'error':''}" id="saveState" aria-live="polite">${saveMessage()}</div><footer class="m-footer" data-chrome><div class="m-row">${ib('上一章','prev','back',M.chapter===1?'disabled':'')}<span class="m-small">第 ${M.chapter} / 5 章</span>${button('摘句','select-example','quiet')}${ib('下一章','next','arrow',M.chapter===5?'disabled':'')}</div>${themeButtons()}<div class="m-row" style="margin-top:8px">${button(M.bookmark?'已加书签':'书签','bookmark','quiet',`aria-pressed="${M.bookmark}"`,'bookmark')}${button('AI 助手','ai-open','quiet','','spark')}</div></footer></main>`}
function saveMessage(){if(M.saved==='saving')return '正在保存批注…';if(M.saved==='failed')return `批注未能持久保存，内容仍在本次会话。<div class="m-row m-wrap">${button('重试保存','retry-save','quiet')}${button('导出批注…','export-notes','quiet')}</div>`;if(M.saved==='recovered')return '已恢复批注，等待写入';return M.marks.length?'批注已保存在此浏览器':'长按选中文字，或点“摘句”试用划词工具'}
function pdfSvg(){const angle=(M.pdf.rotations[M.pdf.page]||0)%360,wide=angle===90||angle===270;const transform=angle===90?'translate(297 0) rotate(90)':angle===180?'translate(210 297) rotate(180)':angle===270?'translate(0 210) rotate(270)':'';return `<svg id="pdfPage" class="m-pdfpage" viewBox="0 0 ${wide?'297 210':'210 297'}" role="img" aria-label="第 ${M.pdf.page} 页 PDF 版式示意，旋转 ${angle} 度"><g transform="${transform}"><rect x="0" y="0" width="210" height="297" fill="var(--panel)"/><g fill="var(--ink)" font-family="system-ui, sans-serif"><text x="20" y="30" font-size="9">激光干涉仪设计手册</text><text x="20" y="50" font-size="11" font-weight="600">${M.pdf.page%2?'2.3 共路干涉布局':'2.4 相位噪声预算'}</text><text x="20" y="70" font-size="7">PDF 页面示意 · 保留页面自身排版</text></g><g stroke="var(--line)" stroke-width="2">${Array.from({length:6},(_,i)=>`<path d="M20 ${86+i*10}h${i%3===2?110:170}"/>`).join('')}</g><g fill="none" stroke="var(--mute)" stroke-width="1"><path d="M45 170h60v-25h55v25h15M105 170v30h55v-30"/><rect x="25" y="162" width="25" height="16"/><rect x="150" y="138" width="24" height="14"/></g><g stroke="var(--line)" stroke-width="2">${Array.from({length:4},(_,i)=>`<path d="M20 ${226+i*10}h${i===3?120:170}"/>`).join('')}</g><g fill="var(--mute)" font-size="7" font-family="system-ui,sans-serif"><text x="20" y="282">原型页面示意，非真实 PDF 渲染</text><text x="184" y="282">${M.pdf.page}</text></g></g></svg>`}
function pdf(){return `<main class="m-reader" data-read-theme="${M.readTheme}"><header class="m-header"><div class="m-nav">${button('书库','pdf-leave','quiet','','back')}<span class="m-subtitle">PDF 阅读</span>${ib('页面操作','pdf-menu','more')}${ib('设置','settings','settings')}</div></header>${M.pdf.pending?`<aside class="m-pending" aria-label="PendingEditBar 未保存修改"><p><strong>PDF 修改尚未保存</strong><br>请另存编辑副本；原始文件未被覆盖。</p><div class="m-row">${button('另存为…','pdf-save','emphasis')}${button('放弃更改','pdf-discard','quiet')}</div></aside>`:''}<section class="m-scroll" id="readScroll" aria-label="PDF 页面"><div class="m-pdfstage">${pdfSvg()}<p class="m-small m-muted" style="margin-top:16px">第 ${M.pdf.page} 页 · ${(M.pdf.rotations[M.pdf.page]||0)%360}° · 适应宽度</p></div></section><footer class="m-footer"><div class="m-row">${ib('上一页','pdf-prev','back',M.pdf.page===1?'disabled':'')}<span class="m-small">第 ${M.pdf.page} / 12 页</span>${ib('下一页','pdf-next','arrow',M.pdf.page===12?'disabled':'')}</div><label for="pageRange" class="m-small m-muted">跳转页面</label><input id="pageRange" class="m-read-progress" type="range" min="1" max="12" step="1" value="${M.pdf.page}" aria-label="PDF 页码">${button('AI 助手','ai-open','quiet','','spark')}</footer></main>`}
function aiContext(){if(M.aiSource==='pdf')return pdfText;if(M.ai.scope==='选区'&&M.selection)return M.selection.text;return paragraphs().join('\n\n')}
function aiCite(c){return `<button type="button" class="m-cite" data-action="cite" data-source="${c.source}" data-chapter="${c.chapter||M.chapter}" data-page="${c.page||M.pdf.page}" data-para="${c.para??1}" aria-label="回跳原文"><span>“${esc(c.quote)}”</span><span class="m-small">《${c.source==='pdf'?bookName('pdf'):bookName('epub')}》 · ${c.source==='pdf'?'第 '+c.page+' 页':'第 '+c.chapter+' 章 · 摘句'} · 查看原文</span></button>`}
function answerBlock(a){return `<article class="m-answer"><div class="m-result-label">本地示例回答 · 非实时 AI 输出</div><p>${esc(a.text)}</p>${aiCite(a)}</article>`}
function ai(){const loading=M.ai.status==='loading';return `<main class="m-ai">${topbar('AI 助手',M.aiSource==='pdf'?'pdf':'reading','close')}<section class="m-context" data-read-theme="${M.readTheme}"><small>当前上下文 · ${M.aiSource==='pdf'?'第 '+M.pdf.page+' 页':'第 '+M.chapter+' 章'}</small><p>${esc((M.selection&&M.ai.scope==='选区'?M.selection.text:aiContext()).slice(0,78))}…</p></section><section class="m-sheet" aria-label="AI 面板"><div class="m-row"><h2 class="m-fill">与文档一起思考</h2><span class="m-small m-muted">本地演示</span></div><div class="m-tabs" role="group" aria-label="AI 操作">${button('摘要','ai-tab','',`data-tab="summary" aria-pressed="${M.ai.tab==='summary'}"`)}${button('对话','ai-tab','',`data-tab="chat" aria-pressed="${M.ai.tab==='chat'}"`)}</div><label for="aiScope" class="m-small">上下文范围</label><select id="aiScope"><option ${M.ai.scope==='当前页'?'selected':''}>当前页</option><option ${M.ai.scope==='选区'?'selected':''} ${!M.selection||M.aiSource==='pdf'?'disabled':''}>选区</option></select><div class="m-chat" id="aiResult">${M.ai.tab==='summary'?(M.ai.summary&&M.ai.summary.source===(M.aiSource==='pdf'?'pdf':'reading')&&(M.aiSource==='pdf'?M.ai.summary.page===M.pdf.page:M.ai.summary.chapter===M.chapter)?answerBlock(M.ai.summary):'<div class="m-empty"><h3>从一段摘要开始</h3><p>先核对内容范围，再生成本地示例。</p></div>'):M.ai.chat.map(a=>a.role==='user'?'<div class="m-user">'+esc(a.text)+'</div>':answerBlock(a)).join('')}${loading?'<p class="m-small m-muted m-pulsing" role="status" style="margin-top:16px">正在准备示例回答…</p>'+button('停止','ai-stop','quiet'):''}${M.ai.error?`<div class="m-feedback" role="alert"><p>${esc(M.ai.error)}</p><div class="m-row m-wrap">${button('重试','ai-preview','quiet')}${button('检查配置','settings','quiet')}</div></div>`:''}</div>${M.ai.tab==='chat'?`<div class="m-composer"><label for="question">你的问题</label><textarea id="question" rows="3" placeholder="基于文档内容提问…" ${loading?'disabled':''}>${esc(M.ai.draft)}</textarea>${button('核对并发送','ai-preview','emphasis',loading?'disabled':'','arrow')}</div>`:`<div class="m-composer">${button(M.ai.summary?'重新生成摘要':'生成摘要','ai-preview','emphasis',loading?'disabled':'','spark')}</div>`}<p class="m-small m-muted" style="margin:16px 0 0">AI 回答可能有误，请核对引用原文。此原型不发送网络请求。</p></section></main>`}
function settings(){return `${topbar('设置',routes[M.settingsFrom]?M.settingsFrom:'library','')}<main class="m-content"><section class="m-settings-section"><h2>外观与阅读</h2><div class="m-field"><label for="appAppearance">应用外观</label><select id="appAppearance"><option value="light" ${M.appTheme==='light'?'selected':''}>浅色</option><option value="dark" ${M.appTheme==='dark'?'selected':''}>深色</option></select><small>应用亮暗与阅读纸张主题独立。</small></div><div class="m-field"><label>阅读主题</label>${themeButtons()}</div><div class="m-field"><label for="fontSize">正文字号 <output id="fontOutput">${M.font}px</output></label><input id="fontSize" type="range" min="16" max="26" step="1" value="${M.font}"><small>EPUB 正文行高 1.9，PDF 页面不重新排版。</small></div><div class="m-context" data-read-theme="${M.readTheme}" style="border-radius:8px"><p id="fontPreview" style="font-size:${M.font}px">阅读应当安静，让文字保留自己的节奏。</p></div></section><section class="m-settings-section"><h2>AI 服务商</h2><p class="m-small m-muted">沿用桌面服务配置结构，原型不连接真实服务。</p><div class="m-field"><label for="provider">服务商预设</label><select id="provider"><option ${M.config.provider==='智谱 GLM'?'selected':''}>智谱 GLM</option><option ${M.config.provider==='自定义'?'selected':''}>自定义</option></select></div><div class="m-field"><label for="baseUrl">Base URL</label><input id="baseUrl" type="text" inputmode="url" value="${esc(M.config.url)}" placeholder="填写服务地址"></div><div class="m-field"><label for="model">模型</label><input id="model" value="${esc(M.config.model)}" placeholder="填写模型名称"></div><p id="configError" class="m-feedback" role="alert" hidden></p>${button('保存配置','config-save','emphasis')}<p class="m-small m-muted" id="configState" style="margin-top:12px">原型不接收真实 API Key，也不进行连接测试。</p></section><section class="m-settings-section"><h2>数据与隐私</h2><p class="m-small m-muted">主题、进度与草稿仅在当前浏览器保存。移动与桌面数据同步边界随实现立项另定。</p>${button('导出批注…','export-notes','quiet')}</section></main>`}
function render(keep=false){const old=keep?$('#readScroll')?.scrollTop:undefined;const active=keep?document.activeElement:null;const activeId=active?.id;const action=active?.dataset?.action;const theme=active?.dataset?.theme;document.documentElement.classList.toggle('dark',M.appTheme==='dark');$('#app').innerHTML=({library,reading:reader,pdf,ai,settings}[screen]||library)();if(keep){if($('#readScroll')&&old!==undefined)$('#readScroll').scrollTop=old;const next=activeId?$('#'+activeId):theme?$(`[data-theme="${theme}"]`):action?$(`[data-action="${action}"]`):null;next?.focus({preventScroll:true})}}
function dialog(html){dialogTrigger=document.activeElement;const d=$('#dialog');d.innerHTML=html;d.showModal();($('input,textarea,button',d)||d).focus()}
function close(){const d=$('#dialog');d.close();if(dialogTrigger?.isConnected)dialogTrigger.focus({preventScroll:true});else $('button,a')?.focus({preventScroll:true})}
function dlFile(name,data,type='application/json'){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function copy(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>announce('已复制摘句')).catch(()=>manualCopy(text))}else manualCopy(text)}
function manualCopy(text){dialog('<h2>复制摘句</h2><p class="m-small m-muted">当前环境不允许直接访问剪贴板，请选中后复制。</p><textarea id="copyValue" rows="4">'+esc(text)+'</textarea><div class="m-actions">'+button('完成','dialog-close')+'</div>');$('#copyValue').select()}
function persistMark(){M.saved='saving';render(true);save();setTimeout(()=>{M.saved=save()?'saved':'failed';save();if(screen==='reading')render(true)},350)}
function mark(type,color){const sel=M.selection;if(!sel){announce('请先选中正文');return}const same=M.marks.find(x=>x.chapter===M.chapter&&x.para===sel.para&&x.text===sel.text);if(same){same.type=type;same.color=color}else M.marks.push({id:crypto.randomUUID(),chapter:M.chapter,para:sel.para,text:sel.text,type,color,note:''});M.selection=null;window.getSelection()?.removeAllRanges();persistMark()}
function pdfConfirm(leave=false){dialog(`<h2>放弃 PDF 更改？</h2><p>尚未另存的页面修改将被放弃，原始文件保持不变。</p><div class="m-actions">${button('继续阅读','dialog-close')}${button('放弃更改','pdf-discard-confirm','emphasis',`data-leave="${leave}"`)}</div>`)}
function aiPreview(){if(M.ai.status==='loading')return;if($('#question'))M.ai.draft=$('#question').value.trim();if(M.ai.tab==='chat'&&!M.ai.draft){announce('请先输入问题');$('#question')?.focus();return}save();const context=aiContext(),history=M.ai.tab==='chat'?M.ai.chat.map(c=>c.role+': '+c.text).join('\n'):'',question=M.ai.tab==='summary'?'总结当前内容':M.ai.draft;const count=t=>[...t].length;pendingPreview={context,history,question,source:M.aiSource==='pdf'?'pdf':'reading',chapter:M.chapter,page:M.pdf.page,para:M.selection&&M.ai.scope==='选区'?M.selection.para:1,quote:M.aiSource==='pdf'?pdfText:M.selection&&M.ai.scope==='选区'?M.selection.text:paragraphs()[1],tab:M.ai.tab};dialog(`<h2>核对即将发送的内容</h2><p class="m-small m-muted">原型为本地演示，点“继续”后不会真实发送。</p><dl><dt>文档</dt><dd>${M.aiSource==='pdf'?bookName('pdf'):bookName('epub')}</dd><dt>操作</dt><dd>${M.ai.tab==='summary'?'摘要':'对话'}</dd><dt>范围</dt><dd>${M.ai.scope}</dd><dt>服务商</dt><dd>${esc(M.config.provider)}（未连接）</dd><dt>文档内容</dt><dd>${count(context)} 个字符</dd><dt>会话历史</dt><dd>${count(history)} 个字符</dd><dt>你的问题</dt><dd>${count(question)} 个字符</dd><dt>内容合计</dt><dd>${count(context)+count(history)+count(question)} 个字符</dd></dl><details><summary>查看本次完整内容</summary><pre>${esc(context+'\n\n'+history+'\n\n'+question)}</pre></details><p class="m-small m-muted">服务商指令不计入用户内容字符数。</p><div class="m-actions">${button('取消','dialog-close')}${button('继续','ai-continue','emphasis')}</div>`)}
const handlers={
'settings':()=>{M.settingsFrom=screen;go('settings')},'dialog-close':close,
'import':()=>dialog('<h2>导入 PDF 或 EPUB</h2><p>移动端从系统“文件”选择文档，不使用拖放。</p><p class="m-small m-muted">本原型未接入系统文件导入。桌面文档的传输与同步方式随实现立项另定。</p><div class="m-actions">'+button('返回书库','dialog-close')+button('载入示例文档','restore','emphasis')+'</div>'),
'restore':()=>{M.books=['epub','pdf'];M.recent='epub';save();if($('#dialog').open)close();render();announce('已载入两份示例文档')},
'manage':()=>dialog('<h2>管理书目</h2><p class="m-small m-muted">仅移除原型书目，不删除原始文件。</p>'+M.books.map(id=>'<div class="m-row" style="margin:16px 0"><span class="m-fill">'+bookName(id)+'</span>'+button('移除','remove-book','',`data-id="${id}"`)+'</div>').join('')+'<div class="m-actions">'+button('完成','dialog-close')+'</div>'),
'remove-book':b=>{M.books=M.books.filter(id=>id!==b.dataset.id);save();close();render();announce('已从原型书库移除，未删除文件')},
 'theme':b=>{M.readTheme=b.dataset.theme;save();render(true)},
 'bookmark':()=>{M.bookmark=!M.bookmark;save();render(true)},
 'chapters':()=>dialog('<h2>目录</h2><div class="m-column">'+chapterTitles.map((c,i)=>button((i+1)+' · '+c,'chapter',M.chapter===i+1?'emphasis':'',`data-chapter="${i+1}"`)).join('')+'</div><div class="m-actions">'+button('关闭','dialog-close')+'</div>'),
 'chapter':b=>{M.chapter=+b.dataset.chapter;M.scroll.reading=0;M.selection=null;save();close();render();$('#readScroll').focus()},
 'prev':()=>{M.chapter=Math.max(1,M.chapter-1);M.selection=null;M.scroll.reading=0;save();render();$('[data-action="prev"]')?.focus()},
 'next':()=>{M.chapter=Math.min(5,M.chapter+1);M.selection=null;M.scroll.reading=0;save();render();$('[data-action="next"]')?.focus()},
 'select-example':()=>{M.selection={text:paragraphs()[1],para:1};save();render(true);$('#passage-1')?.scrollIntoView({block:'center'});$('#selectionBar button')?.focus()},
 'selection-close':()=>{M.selection=null;save();window.getSelection()?.removeAllRanges();render(true)},
 'mark':b=>mark('highlight',b.dataset.color),'underline':()=>mark('underline'),'strike':()=>mark('strike'),
 'copy':()=>copy(M.selection?.text||''),
 'excerpt':()=>{if(!M.selection)return;dialog('<h2>保存摘句</h2><p>'+esc(M.selection.text)+'</p><label for="noteInput">我的笔记</label><textarea id="noteInput" rows="3" placeholder="记下你的想法"></textarea><div class="m-actions">'+button('取消','dialog-close')+button('保存摘句','excerpt-save','emphasis')+'</div>')},
 'excerpt-save':()=>{const text=$('#noteInput').value;if(!M.selection)return;M.marks.push({id:crypto.randomUUID(),chapter:M.chapter,para:M.selection.para,text:M.selection.text,note:text,type:'highlight',color:'yellow'});M.selection=null;close();persistMark()},
 'retry-save':()=>{M.saved='recovered';render(true);setTimeout(persistMark,250)},
 'export-notes':()=>dlFile('booklight-mobile-annotations.json',JSON.stringify({prototype:true,book:'The Sample Book',marks:M.marks},null,2)),
 'ai-selection':()=>{M.ai.scope='选区';M.aiSource='reading';go('ai')},
 'ai-open':()=>{M.aiSource=screen==='pdf'?'pdf':'reading';M.ai.scope='当前页';go('ai')},'ai-back':()=>go(M.aiSource==='pdf'?'pdf':'reading'),
 'ai-tab':b=>{if(M.ai.status==='loading'){announce('请先停止当前演示');return}if($('#question'))M.ai.draft=$('#question').value;M.ai.tab=b.dataset.tab;save();render(true)},
 'ai-preview':aiPreview,
 'ai-continue':()=>{const packet=pendingPreview;if(!packet)return;pendingPreview=null;close();const token=++epoch;M.ai.status='loading';M.ai.error='';if(packet.tab==='chat'&&!(M.ai.chat.at(-1)?.role==='user'&&M.ai.chat.at(-1)?.text===packet.question))M.ai.chat.push({role:'user',text:packet.question});save();render();job=setTimeout(()=>{if(epoch!==token)return;const result={role:'assistant',source:packet.source,chapter:packet.chapter,page:packet.page,para:packet.para,quote:packet.quote,text:packet.source==='pdf'?'这份示例摘要聚焦于光路、采样方式和环境条件。核对这些条件，有助于理解测量差异。':packet.chapter===2?'本章把“起点的不平等”归结为可驯化物种的初始分布，以及大陆轴线对传播的影响。下面的引用可回到原文核对。':'这一示例强调把摘录与上下文保留在一起。先核对问题与证据，再形成自己的解释。'};if(packet.tab==='summary')M.ai.summary=result;else M.ai.chat.push(result);M.ai.status='idle';save();render();announce('本地示例回答已完成，未发送文档内容')},900)},
 'ai-stop':()=>{epoch++;clearTimeout(job);M.ai.status='stopped';M.ai.error='已停止，问题草稿和已有结果已保留。';save();render()},
 'cite':b=>{M.jump={screen:b.dataset.source==='pdf'?'pdf':'reading',chapter:+b.dataset.chapter,page:+b.dataset.page,para:+b.dataset.para};if(M.jump.screen==='reading')M.chapter=M.jump.chapter;else M.pdf.page=M.jump.page;go(M.jump.screen)},
 'pdf-menu':()=>dialog('<h2>页面操作</h2><p class="m-small m-muted">操作对象：第 '+M.pdf.page+' 页。页面操作为原型演示，仅改变内存状态。</p><div class="m-column">'+button('旋转本页 90°','pdf-rotate','','','rotate')+button('AI 助手','pdf-ai','','','spark')+'</div><div class="m-actions">'+button('关闭','dialog-close')+'</div>'),
 'pdf-rotate':()=>{M.pdf.rotations[M.pdf.page]=((M.pdf.rotations[M.pdf.page]||0)+90)%360;M.pdf.pending=true;save();close();render()},
 'pdf-ai':()=>{close();M.aiSource='pdf';M.ai.scope='当前页';go('ai')},
 'pdf-prev':()=>{M.pdf.page=Math.max(1,M.pdf.page-1);save();render();$('[data-action="pdf-prev"]')?.focus()},
 'pdf-next':()=>{M.pdf.page=Math.min(12,M.pdf.page+1);save();render();$('[data-action="pdf-next"]')?.focus()},
 'pdf-discard':()=>pdfConfirm(false),
 'pdf-discard-confirm':b=>{M.pdf.pending=false;M.pdf.rotation=0;M.pdf.rotations={};save();const leave=b.dataset.leave==='true';close();if(leave)go('library');else render()},
 'pdf-leave':()=>{if(!M.pdf.pending)go('library');else dialog('<h2>尚有未保存的 PDF 修改</h2><p>可以保留修改继续阅读，或确认放弃。原型中的修改记录仅保存在当前浏览器。</p><div class="m-actions">'+button('继续阅读','dialog-close')+button('保留并返回','pdf-keep-leave')+button('放弃并返回','pdf-discard-leave','emphasis')+'</div>')},
 'pdf-keep-leave':()=>{close();go('library')},'pdf-discard-leave':()=>pdfConfirm(true),
 'pdf-save':()=>dialog('<h2>另存编辑副本</h2><p>正式应用应另存为一份 PDF，避免覆盖原件。</p><p class="m-small m-muted">原型尚未接入 PDF 文件写出，不能生成已编辑 PDF。你可以导出修改记录以保留演示状态；未保存横幅将继续显示。</p><div class="m-actions">'+button('返回阅读','dialog-close')+button('导出修改记录','pdf-export','emphasis')+'</div>'),
 'pdf-export':()=>{dlFile('booklight-mobile-pdf-edits.json',JSON.stringify({prototype:true,page:M.pdf.page,rotations:M.pdf.rotations,notAnEditedPdf:true},null,2));close();announce('已导出修改记录；PDF 仍未另存')},
 'config-save':()=>{const url=$('#baseUrl').value.trim(),model=$('#model').value.trim();const err=$('#configError');if(url&&!/^https?:\/\/[^\s]+$/.test(url)){err.hidden=false;err.textContent='服务地址应以 http:// 或 https:// 开头。';$('#baseUrl').focus();return}if(!model){err.hidden=false;err.textContent='请填写模型名称。';$('#model').focus();return}M.config={provider:$('#provider').value,url,model};const ok=save();err.hidden=true;$('#configState').textContent=ok?'配置已保存在此浏览器；未发起连接。':'当前环境不允许持久保存，配置仅在本次浏览中有效。'}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){handlers[b.dataset.action]?.(b);return}const a=e.target.closest('[data-nav],[data-book]');if(a){e.preventDefault();if(a.dataset.book){M.recent=a.dataset.book;go(bookLink(a.dataset.book))}else go(a.dataset.nav);return}if(screen==='reading'&&e.target.closest('#prose')&&!e.target.closest('button,a,mark')&&!window.getSelection()?.toString()){const rect=$('#readScroll').getBoundingClientRect();if(e.clientX>rect.left+rect.width*.25&&e.clientX<rect.left+rect.width*.75){const scroll=$('#readScroll').scrollTop;immersive=!immersive;render();$('#readScroll').scrollTop=scroll;$('#readScroll').focus({preventScroll:true})}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fontSize'){M.font=+t.value;$('#fontOutput').textContent=M.font+'px';$('#fontPreview').style.fontSize=M.font+'px';save()}if(t.id==='question'){M.ai.draft=t.value;save()}if(['provider','baseUrl','model'].includes(t.id))$('#configState').textContent='配置尚未保存'});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='appAppearance'){M.appTheme=t.value;save();render(true)}if(t.id==='aiScope'){M.ai.scope=t.value;save()}if(t.id==='pageRange'){M.pdf.page=+t.value;save();render(true)}});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if(screen==='reading'&&e.target.id==='readScroll'&&e.key==='Enter'){e.preventDefault();const old=$('#readScroll').scrollTop;immersive=!immersive;render();$('#readScroll').scrollTop=old;$('#readScroll').focus()}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target.id==='question'){e.preventDefault();aiPreview()}});
let selectionTimer;
document.addEventListener('selectionchange',()=>{if(screen!=='reading')return;clearTimeout(selectionTimer);selectionTimer=setTimeout(()=>{const s=window.getSelection();if(!s||s.isCollapsed)return;const a=s.anchorNode?.parentElement?.closest('#prose p[data-para]'),b=s.focusNode?.parentElement?.closest('#prose p[data-para]');if(!a||a!==b)return;M.selection={text:s.toString().trim(),para:+a.dataset.para};save();const bar=$('#selectionBar');if(bar){bar.innerHTML=selectionBar();bar.hidden=false}},80)});
$('#dialog').addEventListener('cancel',()=>{setTimeout(()=>{if(dialogTrigger?.isConnected)dialogTrigger.focus();else $('button,a')?.focus()},0)});
window.addEventListener('pagehide',capture);
render();
requestAnimationFrame(()=>{const r=$('#readScroll');if(r)r.scrollTop=M.scroll[screen]||0;if(M.jump?.screen===screen){if(screen==='reading')$('#passage-'+M.jump.para)?.scrollIntoView({block:'center'});else announce('已回到引用原文所在的第 '+M.pdf.page+' 页');M.jump=null;save()}});
if(M.saved==='saving'){M.saved='recovered';save();if(screen==='reading')render(true)}
})();

</script>
</body>
</html>
