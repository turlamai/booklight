name: pdf.js spike

# #75 S0: pdf.js inside the glaze webview on every declared platform.
# Render + text layer + selection overlays + domain-core edited re-render,
# real-window evidence (PNG + typed report), no host AX dependency.
on:
  pull_request:
  push:
    branches: [main]

env:
  GLAZE_PIN: df0c98efc66a53029e17eef15ebda2212c507aa0
  GLAZE_RIVET_PIN: bf7a62b9a3331bd5d6df48d1b7fe77be0cfed90d
  # The Windows verified-TLS installer reads RIVET_PIN; the spike pins the
  # rivet revision glaze itself is built against (same pairing as podlens).
  RIVET_PIN: bf7a62b9a3331bd5d6df48d1b7fe77be0cfed90d
  # GPU-less hosted runners have no DRI3 device; WebKitGTK must fall back
  # to the software path or webview startup crashes (glaze docs/ci.md).
  WEBKIT_DISABLE_DMABUF_RENDERER: '1'

jobs:
  spike:
    name: pdf.js spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          # Auto-detection installs x64 on arm64 runners (Exec format error);
          # always pass the matrix architecture explicitly.
          architecture: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}
      - name: Export trusted Mozilla CA roots for Windows Racket
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'booklight-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "BOOKLIGHT_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Glaze (Windows, verified TLS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt --glaze
      - name: Install pinned Rivet + Glaze (catalog)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${GLAZE_RIVET_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
      - name: Linux webview runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o DPkg::Lock::Timeout=120 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb dbus
      - name: Real-window spike (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash spike/pdfjs/linux-verify.sh
      - name: Real-window spike
        if: runner.os != 'Linux'
        shell: bash
        run: racket spike/pdfjs/verify.rkt
      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-evidence-${{ matrix.os }}
          path: .glaze/verify/
          if-no-files-found: warn