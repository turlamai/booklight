name: CI
on:
  push:
    branches: [main]
  pull_request:

# Single source of truth for the rivet pin the Racket engine tests against;
# the glaze carrier pins live in host-ci.yml (single source there).
env:
  RIVET_PIN: c1f0d921e2136c0cfb2c1c1f6d273f2b26222a19
concurrency:
  # GitHub retains at most one pending job per concurrency group.
  # Every main push needs its own evidence; only newer revisions of the
  # same PR may supersede an older queued or running PR check.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Contract preflight (release metadata + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version alignment (VERSION == updater)
        run: bash scripts/check-release-version.sh
      - name: Release signing trust-root negative tests (no secrets)
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_signing.py'
      - name: Prevent book library / reading analytics regression
        run: node scripts/check-file-first.mjs

  racket-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: |
          # TEMP (upstream outage): the catalog still serves keel@b36401d,
          # which ships tests/documentation and hard-conflicts with rivet's
          # own module path (keel@d56e38f renamed it; the catalog
          # re-publish is pending). Pin the fixed keel first so --auto
          # keeps it. Remove this line once the catalog serves keel >=
          # d56e38f.
          raco pkg install --auto --no-docs 'https://github.com/turlamai/keel.git#e11aa621df48daaa319b17ec742ffce808274c81'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}' crypto
      - name: Domain core tests
        run: raco test racket/