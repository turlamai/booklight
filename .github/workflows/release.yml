name: Release

on:
  push:
    tags: ['v*']

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: v0.12.0
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

      - name: Validate release signing key before starting platform builds
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error::Missing Ed25519 release signing key; refusing unsigned update feed"
            exit 1
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 --decode > "$key"
          python3 scripts/check-update-signing-key.py "$key"

  macos:
    needs: validate
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          # Each leg builds the architecture it will package (family
          # release.yml macos matrix pattern).
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}' crypto
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package
        run: raco rivet package
      - name: Declare bundle localizations (zh-Hans + en system chrome)
        run: bash scripts/localize-app.sh dist/booklight.app
      - name: Portable zip + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qry "booklight-${VERSION}-macos-${{ matrix.arch }}.zip" booklight.app
          shasum -a 256 "booklight-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "booklight-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG, drag to Applications)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/booklight.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Booklight ${VERSION}" -srcfolder "$staging" -ov -format UDZO \
            "dist/booklight-${VERSION}-macos-${{ matrix.arch }}.dmg"
          hdiutil attach "dist/booklight-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            -mountpoint "$RUNNER_TEMP/dmg-verify" -readonly
          test -d "$RUNNER_TEMP/dmg-verify/booklight.app"
          hdiutil detach "$RUNNER_TEMP/dmg-verify"
          cd dist
          shasum -a 256 "booklight-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "booklight-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: dist/booklight-*
          if-no-files-found: error

  windows:
    needs: validate
    name: Windows (MSI + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install crypto (updater dependency)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto
      - name: Install WiX (v5; rivet's MSI toolchain)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      # Same zlib pre-step as ci.yml's windows-host job: the codegen
      # instantiates the backend's pdf FFI, and CopyZlibDll ships the DLL in
      # the MSI / portable zip so the launch smoke and end users find it.
      - name: Locate zlib for the backend FFI
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "windows\locate-zlib.ps1" -ProjectDir "windows"
          $out | Write-Host
          $dir = ($out | Select-String -Pattern 'ZLIBDIR=(.+)').Matches.Groups[1].Value
          (Resolve-Path $dir).Path >> $env:GITHUB_PATH
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # MSI + portable zip + SBOM + notices, launch smoke included (the
      # taskly windows release shape). The portable zip is the update-feed
      # entry; the publish job assembles and signs the merged manifest.
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet v0.11.0 names the MSI and the portable zip in family form
          # already; only the SBOM/notices lack the platform segment.
          mv sbom.cdx.json "booklight-${VERSION}-windows-x64.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "booklight-${VERSION}-windows-x64-THIRD_PARTY_NOTICES.txt"
          for f in booklight-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/notices/wixpdb bodies stay in the CI artifact only;
              # a sidecar without its body on the release is a dangling
              # reference (the taskly 1.4.0 leftover). Checksum what we upload.
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/booklight-*
          if-no-files-found: error

  linux:
    needs: validate
    name: Linux package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      # Keep the action ref in lockstep with RIVET_PIN above (and with
      # ci.yml's copy of this step) — it ships the runtime the pinned rivet
      # expects.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@v0.12.0
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, WebKitGTK and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libjson-glib-dev \
            libglib2.0-dev file rpm desktop-file-utils
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # tar.gz (the update-feed payload) + deb + rpm + AppImage + portable
      # zip + SBOM, launch smoke included. The AppImage carries its own GTK
      # dependency closure and libpdfium.so; APPIMAGE_EXTRACT_AND_RUN lets
      # appimagetool run on the runner (taskly release.yml pattern).
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          cd dist
          ls -1
          # The AppImage sidecar (write-appimage-checksum!) backs the
          # AppImage self-update flow — keep it verbatim. Everything else
          # gets a sidecar if it lacks one.
          for f in booklight-*; do
            case "$f" in
              *.sha256) ;;
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ matrix.arch }}
          path: dist/booklight-*
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}' crypto
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/macos-package-arm64/* artifacts/macos-package-x64/* dist/
          mv artifacts/windows-package/* dist/
          mv artifacts/linux-package-x64/* artifacts/linux-package-arm64/* dist/
      - name: Sign the update feed over the final zips
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          # Every supported host verifies the signed release feed for
          # in-app updates; publishing an un-updatable release is a hard
          # failure, not a warning (taskly release.yml pattern).
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is missing; refusing to publish without a signed update manifest"
            exit 1
          fi
          KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          python3 scripts/check-update-signing-key.py "$KEY_DER"
          scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
          test -s dist/update-stable.json || {
            echo "::error::Signed update manifest was not generated"
            exit 1
          }
      - name: Notes = CHANGELOG section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          head -3 /tmp/notes.md
      - name: SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "${{ github.ref_name }}" -R turlamai/booklight >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turlamai/booklight
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turlamai/booklight \
              --title "Booklight ${VERSION}" \
              --notes-file /tmp/notes.md
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - name: Stable alias copies (versionless direct-download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Family rule: download buttons point at
          # releases/latest/download/<alias>, so every release also ships
          # versionless copies of the primary installers (dmg per macOS
          # arch, MSI for Windows). Deliberately after the provenance
          # attestation so dist/* there stays versioned-only.
          mkdir -p stable-alias
          cp "dist/booklight-${VERSION}-macos-arm64.dmg" stable-alias/booklight-macos-arm64.dmg
          cp "dist/booklight-${VERSION}-macos-x64.dmg" stable-alias/booklight-macos-x64.dmg
          # Linux: deb (x64/arm64), AppImage (x86_64/aarch64 naming) and
          # the tar.gz the linux feed entry serves.
          cp "dist/booklight-${VERSION}-linux-amd64.deb" stable-alias/booklight-linux-x64.deb
          cp "dist/booklight-${VERSION}-linux-arm64.deb" stable-alias/booklight-linux-arm64.deb
          cp "dist/booklight-${VERSION}-linux-x86_64.AppImage" stable-alias/booklight-linux-x64.AppImage
          cp "dist/booklight-${VERSION}-linux-aarch64.AppImage" stable-alias/booklight-linux-arm64.AppImage
          cp "dist/booklight-${VERSION}-linux-x64.tar.gz" stable-alias/booklight-linux-x64.tar.gz
          cp "dist/booklight-${VERSION}-linux-arm64.tar.gz" stable-alias/booklight-linux-arm64.tar.gz
          cp "dist/booklight-${VERSION}-windows-x64.msi" stable-alias/booklight-windows-x64.msi
          gh release upload "${{ github.ref_name }}" stable-alias/* --clobber -R turlamai/booklight
