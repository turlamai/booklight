name: Release

on:
  push:
    tags: ['v*']

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: d6e98896fffa3f484e9ea0162d807ad2518c1538
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

      - name: Validate release signing key before starting platform builds
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error::Missing Ed25519 release signing key; refusing unsigned update feed"
            exit 1
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 --decode > "$key"
          python3 scripts/check-update-signing-key.py "$key"

  macos:
    needs: validate
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    env:
      # Production signing lights up as soon as the account-level secrets
      # exist (Developer ID p12 + App Store Connect API key) and applies to
      # every workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see rivet docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          # Each leg builds the architecture it will package (family
          # release.yml macos matrix pattern).
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}' crypto
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          # rivet reads exactly these two (rivet docs/production-signing.md);
          # they only take effect with the explicit --production package
          # call below.
          {
            echo "RIVET_MACOS_SIGN_IDENTITY=$IDENTITY_NAME"
            echo "RIVET_MACOS_NOTARY_PROFILE=ASC_NOTARY"
          } >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      # `raco rivet package --production` is production packaging (rivet
      # docs/production-signing.md): with the credentials exported above it
      # Developer ID-signs, notarizes, staples, and re-verifies inside rivet
      # itself, failing closed when they are absent.
      - name: Package (Developer ID + notarized)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: raco rivet package --production
      - name: Package (ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        run: raco rivet package
      - name: Package requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      - name: Portable zip + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qry "booklight-${VERSION}-macos-${{ matrix.arch }}.zip" booklight.app
          shasum -a 256 "booklight-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "booklight-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG, drag to Applications)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/booklight.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Booklight ${VERSION}" -srcfolder "$staging" -ov -format UDZO \
            "dist/booklight-${VERSION}-macos-${{ matrix.arch }}.dmg"
          hdiutil attach "dist/booklight-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            -mountpoint "$RUNNER_TEMP/dmg-verify" -readonly
          test -d "$RUNNER_TEMP/dmg-verify/booklight.app"
          hdiutil detach "$RUNNER_TEMP/dmg-verify"
          cd dist
          shasum -a 256 "booklight-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "booklight-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: dist/booklight-*
          if-no-files-found: error

  windows:
    needs: validate
    name: Windows (MSI + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install crypto (updater dependency)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto
      - name: Install WiX (v5; rivet's MSI toolchain)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      # Same zlib pre-step as ci.yml's windows-host job: the codegen
      # instantiates the backend's pdf FFI, and CopyZlibDll ships the DLL in
      # the MSI / portable zip so the launch smoke and end users find it.
      - name: Locate zlib for the backend FFI
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "windows\locate-zlib.ps1" -ProjectDir "windows"
          $out | Write-Host
          $dir = ($out | Select-String -Pattern 'ZLIBDIR=(.+)').Matches.Groups[1].Value
          (Resolve-Path $dir).Path >> $env:GITHUB_PATH
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # MSI + portable zip + SBOM + notices, launch smoke included (the
      # taskly windows release shape). The portable zip is the update-feed
      # entry; the publish job assembles and signs the merged manifest.
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet v0.11.0 names the MSI and the portable zip in family form
          # already; only the SBOM/notices lack the platform segment.
          mv sbom.cdx.json "booklight-${VERSION}-windows-x64.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "booklight-${VERSION}-windows-x64-THIRD_PARTY_NOTICES.txt"
          for f in booklight-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/notices/wixpdb bodies stay in the CI artifact only;
              # a sidecar without its body on the release is a dangling
              # reference (the taskly 1.4.0 leftover). Checksum what we upload.
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/booklight-*
          if-no-files-found: error

  linux:
    needs: validate
    name: Linux package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Legacy pin workaround, kept while unverified on the new pin:
          # Ubuntu 26.04's rpm 4.19 changed the buildroot location and the
          # old Rivet pin staged the RPM into the old BUILDROOT, so
          # rpmbuild reported an empty /opt/booklight. Rivet d6e9889 carries
          # the later RPM fixes (rpmdb topdir, unquoted %files globs,
          # unprivileged dbpath); try the x64 release leg on ubuntu-latest
          # again before retiring this pin to 24.04.
          - { arch: x64, runner: ubuntu-24.04, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      # Keep the action ref in lockstep with RIVET_PIN above (and with
      # ci.yml's copy of this step) — it ships the runtime the pinned rivet
      # expects.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@d6e98896fffa3f484e9ea0162d807ad2518c1538
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, WebKitGTK and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libjson-glib-dev \
            libglib2.0-dev file rpm desktop-file-utils
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # tar.gz (the update-feed payload) + deb + rpm + AppImage + portable
      # zip + SBOM, launch smoke included. The AppImage carries its own GTK
      # dependency closure and libpdfium.so; APPIMAGE_EXTRACT_AND_RUN lets
      # appimagetool run on the runner (taskly release.yml pattern).
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      # Wraps the tar.gz payload into a Flatpak bundle from the flatpak/
      # manifest template (family contract: deb+rpm+AppImage+Flatpak+tar.gz).
      # The manifest's module closure covers the two NEEDED entries outside
      # the GNOME Platform runtime (liblz4.so.1, libtinfo.so.6). Like
      # deb/rpm, the flatpak install shape is manual-by-design and stays
      # out of the signed update feed. Runs before Family naming so the
      # bundle joins the checksum sweep.
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc covers the
          # ubuntu-24.04-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/booklight-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "booklight-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.booklight.yml > site.jrtx.booklight.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.booklight.gen.yml
          flatpak build-bundle flatpak-repo \
            "booklight-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.booklight stable
          mv "booklight-${VERSION}-linux-${ARCH}.flatpak" dist/
          rm -rf flatpak-build flatpak-repo \
            "booklight-${VERSION}-linux-${ARCH}.tar.gz" site.jrtx.booklight.gen.yml
          test -f "dist/booklight-${VERSION}-linux-${ARCH}.flatpak"
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          cd dist
          ls -1
          # The AppImage sidecar (write-appimage-checksum!) backs the
          # AppImage self-update flow — keep it verbatim. Everything else
          # gets a sidecar if it lacks one.
          for f in booklight-*; do
            case "$f" in
              *.sha256) ;;
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ matrix.arch }}
          path: dist/booklight-*
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}' crypto
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/macos-package-arm64/* artifacts/macos-package-x64/* dist/
          mv artifacts/windows-package/* dist/
          mv artifacts/linux-package-x64/* artifacts/linux-package-arm64/* dist/
      - name: Sign the update feed over the final zips
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          # Every supported host verifies the signed release feed for
          # in-app updates; publishing an un-updatable release is a hard
          # failure, not a warning (taskly release.yml pattern).
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is missing; refusing to publish without a signed update manifest"
            exit 1
          fi
          KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          python3 scripts/check-update-signing-key.py "$KEY_DER"
          scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
          test -s dist/update-stable.json || {
            echo "::error::Signed update manifest was not generated"
            exit 1
          }
      - name: Notes = CHANGELOG section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          head -3 /tmp/notes.md
      - name: Verify and stage the exact public release
        run: |
          set -euo pipefail
          (cd dist && cat *.sha256 | sed 's/ \*/  /' | LC_ALL=C sort -k2 > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import os
          from pathlib import Path

          v = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          prefix = f"booklight-{v}-"
          required = {
              prefix + suffix for suffix in (
                  "macos-arm64.dmg", "macos-arm64.zip",
                  "macos-x64.dmg", "macos-x64.zip",
                  "windows-x64.msi", "windows-x64.zip",
                  "linux-arm64.tar.gz", "linux-arm64.zip",
                  "linux-x64.tar.gz", "linux-x64.zip",
                  "linux-arm64.deb", "linux-amd64.deb",
                  "linux-aarch64.AppImage", "linux-x86_64.AppImage",
                  "linux-arm64.flatpak", "linux-x64.flatpak",
              )
          }
          rows = [line.split() for line in Path("dist/SHA256SUMS").read_text().splitlines()]
          actual = [row[1] for row in rows if len(row) == 2]
          # RPM release-number is a packaging revision, not app SemVer;
          # enforce exactly one per CPU without hard-coding the revision.
          import re
          rpm_arches = ("aarch64", "x86_64")
          rpm = [
              name for name in actual
              if re.fullmatch(re.escape(prefix) + r"[0-9]+-linux-(aarch64|x86_64)\.rpm", name)
          ]
          for arch in rpm_arches:
              matching = [name for name in rpm if name.endswith(f"-linux-{arch}.rpm")]
              if len(matching) != 1:
                  raise SystemExit(f"Expected one RPM for {arch}, found {matching}")
          required.update(rpm)
          if len(rows) != len(actual) or len(actual) != len(required) or set(actual) != required:
              raise SystemExit(
                  f"Bad public asset matrix: missing={sorted(required - set(actual))}; "
                  f"unexpected={sorted(set(actual) - required)}"
              )
          for name in actual:
              path = Path("dist") / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty installer: {name}")
              # Every published body ships with its per-asset sidecar: the
              # AppImage self-update flow downloads `<asset>.sha256` from
              # this release and refuses the swap without it, so a release
              # whose sidecars did not make it to publish-assets would
              # strand every AppImage install on an update error.
              sidecar = Path("dist") / (name + ".sha256")
              if not sidecar.is_file() or sidecar.stat().st_size == 0:
                  raise SystemExit(f"Missing checksum sidecar for published asset: {name}")
          PY
          mkdir -p publish-assets
          while read -r _ name; do
            cp "dist/$name" "publish-assets/$name"
            [ -f "dist/$name.sha256" ] && cp "dist/$name.sha256" "publish-assets/$name.sha256"
          done < dist/SHA256SUMS
          cp dist/SHA256SUMS dist/update-stable.json dist/update-manifest.json publish-assets/
          (cd publish-assets && sha256sum --check SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          if gh release view "$GITHUB_REF_NAME" -R turlamai/booklight >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md -R turlamai/booklight
            gh release upload "$GITHUB_REF_NAME" publish-assets/* --clobber -R turlamai/booklight
          else
            gh release create "$GITHUB_REF_NAME" publish-assets/* \
              -R turlamai/booklight \
              --title "Booklight $VERSION" \
              --notes-file /tmp/notes.md
          fi
          # Reruns must prune old sidecars, aliases, and build-only output.
          gh release view "$GITHUB_REF_NAME" -R turlamai/booklight --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "publish-assets/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes -R turlamai/booklight
              fi
            done
      - name: Attest public artifact provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: publish-assets/*
