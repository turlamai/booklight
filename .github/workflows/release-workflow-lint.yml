name: Release workflow syntax
on:
  pull_request:
    paths: ['.github/workflows/**', 'scripts/check-release-workflows.py']
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/check-release-workflows.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/check-release-workflows.py
