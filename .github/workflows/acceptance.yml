name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    # Run packaged native acceptance for stacked file-first/P0 fix PRs.
    branches: [main, refactor/file-first-reader-20261029]

permissions:
  contents: read

env:
  RIVET_PIN: v0.12.0
  KEEL_PIN: d56e38f6ad89a5e85c455ac1b26acd2dfd312165

concurrency:
  # Keep each main acceptance gate; GitHub silently replaces older pending
  # runs that share a group. Only superseded revisions of one PR cancel.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Export trusted Mozilla CA roots for Windows Racket
        shell: pwsh
        run: |
          # Racket 9.3's Windows ROOT-store reader throws X509*->C on some
          # hosted runners. Node bundles Mozilla CA roots independently of
          # Windows; export the roots, without disabling TLS verification.
          $bundle = Join-Path $env:RUNNER_TEMP 'booklight-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "BOOKLIGHT_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Rivet and dependencies with verified TLS
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt --crypto
      - name: Locate zlib for the backend FFI
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "windows\locate-zlib.ps1" -ProjectDir "windows"
          $out | Write-Host
          $dir = ($out | Select-String -Pattern 'ZLIBDIR=(.+)').Matches.Groups[1].Value
          (Resolve-Path $dir).Path >> $env:GITHUB_PATH
      # Temporary diagnostic: the acceptance suite truncates captured stdout
      # at 64 KiB, which swallowed the MSBuild error. Compile the host
      # project directly with the exact arguments rivet build uses and keep
      # a full binary log as an artifact.
      - name: Diagnostic verbose MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\amd64\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found via vswhere' }
          Write-Host "msbuild: $msbuild"
          & $msbuild "windows\RivetHost.vcxproj" "/restore" "/m" `
            "/p:PreferredToolArchitecture=x64" "/p:Configuration=Debug" `
            "/p:Platform=x64" "/p:RivetSelfContained=false" `
            "/p:OutDir=$env:RUNNER_TEMP\diag-stage\" `
            "/flp:logfile=$env:RUNNER_TEMP\msbuild-diag.log;verbosity=diagnostic" `
            "/fl1:logfile=$env:RUNNER_TEMP\msbuild-errors.log;errorsonly"
          $code = $LASTEXITCODE
          if (Test-Path "$env:RUNNER_TEMP\msbuild-errors.log") {
            Get-Content "$env:RUNNER_TEMP\msbuild-errors.log" | Write-Host
          }
          if ($code -ne 0) {
            Get-Content "$env:RUNNER_TEMP\msbuild-diag.log" -Tail 120 | Write-Host
            throw "diagnostic MSBuild failed with exit code $code"
          }
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booklight-acceptance-windows
          path: |
            .rivet/acceptance/
            ${{ runner.temp }}/msbuild-diag.log
            ${{ runner.temp }}/msbuild-errors.log
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: ${{ matrix.arch }}
          distribution: full
          variant: CS
      - name: Install pinned Rivet and dependencies
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}" crypto
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booklight-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance/
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install native and accessibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libjson-glib-dev libglib2.0-dev \
            libsecret-1-dev liblz4-dev zlib1g-dev libncurses-dev xvfb xdotool \
            at-spi2-core python3-pyatspi
      - name: Install pinned Rivet and dependencies
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}" crypto
      - name: Remember full Racket command path
        run: echo "FULL_RACKET_BIN=$(dirname "$(command -v raco)")" >> "$GITHUB_ENV"
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@v0.12.0
      - name: Run executable product acceptance
        run: PATH="$FULL_RACKET_BIN:$PATH" dbus-run-session -- raco rivet acceptance --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booklight-acceptance-linux
          path: .rivet/acceptance/
          if-no-files-found: warn
