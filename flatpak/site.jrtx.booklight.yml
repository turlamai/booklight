# Flatpak bundle for the glaze carrier payload (#75 S6; portable tree:
# bin/ + lib/, public/ assembled at runtime from define-runtime-path inside
# lib/). GNOME 50 ships WebKitGTK 4.1 (GTK3) and the GStreamer closure the
# carrier needs; the release workflow asserts both inside the Sdk before
# building. The release workflow stages flatpak-src/ from dist/ so the bundle
# payload is byte-identical to the portable update tarball.
app-id: site.jrtx.booklight
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: booklight
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # prefer_xwayland_backend() picks X11 exactly when DISPLAY is set and
  # WAYLAND_DISPLAY is not; granting only the X11 socket keeps that
  # decision deterministic. dri/ipc also serve the WebKitGTK renderer's
  # compositing path.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # Booklight is file-first (SECURITY.md): it opens PDF/EPUB documents
  # where they already live — arbitrary locations under home — and writes
  # the per-document annotation sidecars (<document>.booklight.json) next
  # to them. Settings under the config dir follow XDG_CONFIG_HOME
  # (racket/booklight/settings.rkt) and are redirected into the sandboxed
  # home, needing no grant.
  - --filesystem=home
  # Outbound network per SECURITY.md: update checks/downloads against
  # GitHub Releases, plus LLM requests to the user-configured BYOK
  # provider endpoints (translate/summarize/chat streaming). Both are
  # product behavior; document rendering stays local.
  - --share=network
  # The BYOK provider key lives in the OS credential store on Linux —
  # Secret Service through `secret-tool` (racket/booklight/
  # secure-store.rkt); the session-bus name below is what that traffic
  # addresses. Without it the store would silently fall back to the
  # mode-0600 file, which the contract calls the no-secret-service
  # fallback, not the desktop default.
  - --talk-name=org.freedesktop.secrets
modules:
  - name: booklight
    buildsystem: simple
    build-commands:
      - mkdir -p /app/booklight
      - cp -a bin lib /app/booklight/
      - install -Dm755 booklight.sh /app/bin/booklight
      - install -Dm644 site.jrtx.booklight.desktop /app/share/applications/site.jrtx.booklight.desktop
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/site.jrtx.booklight.png
    sources:
      - type: dir
        path: flatpak-src
      - type: file
        path: booklight.sh
      - type: file
        path: site.jrtx.booklight.desktop
      - type: file
        path: icon-512.png